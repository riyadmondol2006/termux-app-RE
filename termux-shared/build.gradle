plugins {
    id "com.android.library"
    id "maven-publish"
}

android {
    namespace = "com.termux.shared"

    compileSdk = project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdk = project.properties.minSdkVersion.toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            ndkBuild {
                cppFlags ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path = file('src/main/cpp/Android.mk')
        }
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.annotation
    implementation libs.androidx.core
    implementation libs.material
    implementation libs.guava
    implementation libs.bundles.markwon
    implementation libs.hiddenapibypass
    implementation libs.androidx.window
    // Pinned, see gradle/libs.versions.toml.
    implementation libs.commons.io
    implementation libs.termux.am.library

    implementation project(":terminal-view")

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    coreLibraryDesugaring libs.desugar.jdk.libs
}

def sourceJar = tasks.register("sourceJar", Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'termux-shared'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
