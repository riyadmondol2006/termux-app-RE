[versions]
agp = "9.5.1"

androidx-annotation = "1.11.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-drawerlayout = "1.2.0"
androidx-preference = "1.2.1"
androidx-swiperefreshlayout = "1.1.0"
androidx-viewpager = "1.1.0"
androidx-window = "1.5.1"
androidx-test-junit = "1.3.0"
material = "1.14.0"
guava = "33.8.0-android"
markwon = "4.6.2"
hiddenapibypass = "6.2"
# Do not increment higher than 2.5 or there will be runtime exceptions on Android < 8
# due to missing classes like java.nio.file.Path.
commons-io = "2.5"
termux-am-library = "v2.0.0"
desugar-jdk-libs = "2.1.5"
junit = "4.13.2"
robolectric = "4.18"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "androidx-drawerlayout" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidx-preference" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "androidx-viewpager" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
guava-listenablefuture-empty = { module = "com.google.guava:listenablefuture", version = "9999.0-empty-to-avoid-conflict-with-guava" }
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-ext-strikethrough = { module = "io.noties.markwon:ext-strikethrough", version.ref = "markwon" }
markwon-linkify = { module = "io.noties.markwon:linkify", version.ref = "markwon" }
markwon-recycler = { module = "io.noties.markwon:recycler", version.ref = "markwon" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
termux-am-library = { module = "com.termux:termux-am-library", version.ref = "termux-am-library" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[bundles]
markwon = ["markwon-core", "markwon-ext-strikethrough", "markwon-linkify", "markwon-recycler"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
