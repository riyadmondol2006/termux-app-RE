name: Build bootstraps

# Makes bootstrap archives for the app package name (termuxPackageName in gradle.properties) from
# the Termux RE package repository and publishes them on the GitHub Pages site of this repository
# as bootstrap/<id>/bootstrap-<arch>.zip, with a SHA256SUMS file signed with the repository key,
# and bootstrap/latest set to the id (see the Publish packages workflow). The Build workflow uses
# the newest automatically, and local builds can use one with
#   ./gradlew assembleDebug -PtermuxBootstrapUrl=https://<owner>.github.io/<repo>/bootstrap/<id>
#
# Termux binaries hardcode /data/data/<package name>/files/usr, so the official bootstrap and
# repositories only work for com.termux. The bootstraps are assembled with termux-packages'
# generate-bootstraps.sh, like the official ones, from the Termux RE repository: the bootstrap
# packages and their runtime dependencies, with apt using and trusting that repository (see
# apt-repo/patch-termux-packages.sh), from a local copy checked against the signed index (see
# apt-repo/mirror-repo.py). Each archive is checked with apt-repo/check-bootstrap.py.
#
# With source "build", every bootstrap package is first built from source in the termux-packages
# Docker image with build-bootstraps.sh and published in the repository, which takes about an
# hour. Its own archives are not used: they contain every package built, build dependencies too.
# With source "repository", the bootstraps are assembled from what the repository has, which takes
# minutes.

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App package name, must be termuxPackageName of gradle.properties'
        default: 'com.termux.re'
        required: true
      architectures:
        description: 'Comma separated architectures'
        default: 'aarch64,arm,i686,x86_64'
        required: true
      termux_packages_ref:
        description: 'termux/termux-packages branch, tag or commit'
        default: 'master'
        required: true
      source:
        description: 'build: build and publish the packages first (about an hour), repository: use the packages in the Termux RE package repository (minutes)'
        type: choice
        options: [build, repository]
        default: build

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.inputs.outputs.architectures }}
      repo_url: ${{ steps.inputs.outputs.repo_url }}
      bootstrap_id: ${{ steps.inputs.outputs.bootstrap_id }}
      all_architectures: ${{ steps.inputs.outputs.all_architectures }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: apt-repo
          persist-credentials: false

      - name: Validate inputs
        id: inputs
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          if ! [[ "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "Invalid package name '$PACKAGE_NAME'"; exit 1
          fi
          # The Termux RE package repository has packages for the app package name only.
          if [ "$PACKAGE_NAME" != "$(sed -n 's/^termuxPackageName=//p' gradle.properties)" ]; then
            echo "'$PACKAGE_NAME' is not termuxPackageName of gradle.properties, the package repository is built for that"; exit 1
          fi
          for arch in ${ARCHITECTURES//,/ }; do
            case "$arch" in aarch64|arm|i686|x86_64) ;; *) echo "Invalid architecture '$arch'"; exit 1 ;; esac
          done
          OWNER="${GITHUB_REPOSITORY%%/*}"
          {
            echo "architectures=$(jq -cn --arg a "$ARCHITECTURES" '$a | split(",")')"
            echo "repo_url=https://${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/apt/termux-main"
            echo "bootstrap_id=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
            # The app needs the bootstraps of all architectures.
            ALL=true
            for arch in aarch64 arm i686 x86_64; do
              [[ ",$ARCHITECTURES," == *",$arch,"* ]] || ALL=false
            done
            echo "all_architectures=$ALL"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: inputs.source == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.architectures) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: apt-repo
          path: termux-app-re
          persist-credentials: false

      - name: Clone termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_packages_ref }}
          path: termux-packages
          persist-credentials: false

      - name: Configure termux-packages
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          REPO_URL: ${{ needs.setup.outputs.repo_url }}
        run: |
          ./termux-app-re/apt-repo/fix-termux-packages.sh termux-packages
          ./termux-app-re/apt-repo/patch-termux-packages.sh termux-packages "$PACKAGE_NAME" "$REPO_URL"
          echo "termux-packages $(git -C termux-packages rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build packages
        working-directory: termux-packages
        # Source downloads sometimes fail on GitHub's runners. Another attempt resumes in the same
        # container: packages that were built already are not built again.
        run: |
          for attempt in 1 2 3 4; do
            ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures "${{ matrix.arch }}" < /dev/null && exit 0
            echo "::warning::Building the bootstrap packages failed (attempt $attempt)"
            [ "$attempt" -lt 4 ] && sleep 120
          done
          exit 1

      - name: Collect packages
        # Artifact file names can't contain ":", which versions with an epoch have. The file
        # names don't matter, the repository is built from the package metadata.
        run: |
          mkdir debs
          for deb in termux-packages/output/*.deb; do
            cp "$deb" "debs/$(basename "$deb" | tr ':' '_')"
          done
          ls debs | wc -l

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [setup, build]
    # Publish what was built even if an architecture failed, Build bootstraps with source
    # "repository" can use it later.
    if: ${{ !cancelled() && inputs.source == 'build' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish_packages.yml
    with:
      artifact_pattern: debs-*
    secrets: inherit

  assemble:
    needs: [setup, build, publish]
    # Runs after all packages were built and published, or right away with source "repository".
    if: ${{ !cancelled() && needs.setup.result == 'success' && (inputs.source == 'repository' || (needs.build.result == 'success' && needs.publish.result == 'success')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.architectures) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Clone termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_packages_ref }}
          path: termux-packages
          persist-credentials: false

      - name: Configure termux-packages
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          REPO_URL: ${{ needs.setup.outputs.repo_url }}
        run: ./apt-repo/patch-termux-packages.sh termux-packages "$PACKAGE_NAME" "$REPO_URL"

      - name: Copy the published repository
        env:
          REPO_URL: ${{ needs.setup.outputs.repo_url }}
        # generate-bootstraps.sh reads a repository without checking signatures or checksums, and
        # GitHub Pages serves the previous deployment for a few minutes after a publish. Assemble
        # from a local copy instead, in which the index and every package match the signed
        # InRelease file.
        run: python3 -I apt-repo/mirror-repo.py "$REPO_URL" apt-repo/termux-re.gpg "${{ matrix.arch }}" "$RUNNER_TEMP/repo"

      - name: Assemble bootstrap
        working-directory: termux-packages
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/repo" > /dev/null 2>&1 &
          trap 'kill $!' EXIT
          sleep 2
          ./scripts/generate-bootstraps.sh --repository http://127.0.0.1:8765 --architectures "${{ matrix.arch }}"

      - name: Check bootstrap
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          REPO_URL: ${{ needs.setup.outputs.repo_url }}
        run: |
          set -euo pipefail
          # Compare the package list with the official bootstrap the app builds with by default.
          VERSION="$(sed -n -E 's/^\s*def version = "([^"]+)" \+ "%2B" \+ "apt.android-7"$/\1/p' app/build.gradle)"
          OFFICIAL=()
          if [ -n "$VERSION" ] && curl -fsSL -o "$RUNNER_TEMP/official-bootstrap-${{ matrix.arch }}.zip" \
              "https://github.com/termux/termux-packages/releases/download/bootstrap-$VERSION%2Bapt.android-7/bootstrap-${{ matrix.arch }}.zip"; then
            OFFICIAL=("$RUNNER_TEMP/official-bootstrap-${{ matrix.arch }}.zip")
          fi
          python3 -I apt-repo/check-bootstrap.py "termux-packages/bootstrap-${{ matrix.arch }}.zip" "$PACKAGE_NAME" "$REPO_URL" \
            apt-repo/termux-re.gpg "$RUNNER_TEMP/repo/dists/stable/main/binary-${{ matrix.arch }}/Packages" "${OFFICIAL[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.arch }}
          path: termux-packages/bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish-bootstrap:
    needs: [setup, assemble]
    # The app needs the bootstraps of all architectures, others are only checked.
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.setup.outputs.all_architectures == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish_packages.yml
    with:
      bootstrap_pattern: bootstrap-*
      bootstrap_id: ${{ needs.setup.outputs.bootstrap_id }}
    secrets: inherit
