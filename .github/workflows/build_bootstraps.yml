name: Build bootstraps

# Builds bootstrap archives for a custom app package name (default: com.termux.re) from
# termux-packages sources and publishes them as a "bootstrap-<package name>-<run number>"
# GitHub release with a SHA256SUMS file. The Build workflow picks up the newest such release
# automatically, and local builds can use it with
#   ./gradlew assembleDebug -PtermuxBootstrapUrl=https://github.com/<owner>/<repo>/releases/download/<tag>
#
# Termux binaries hardcode /data/data/<package name>/files/usr, so the official bootstrap only
# works for com.termux. These bootstraps work for the custom package name, but `pkg install`
# of packages from the official Termux repos will not, those need a repo built for the same
# package name.
#
# Each architecture builds all bootstrap packages from source in the termux-packages Docker
# image, which takes a few hours.

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App package name to build the bootstraps for'
        default: 'com.termux.re'
        required: true
      architectures:
        description: 'Comma separated architectures'
        default: 'aarch64,arm,i686,x86_64'
        required: true
      termux_packages_ref:
        description: 'termux/termux-packages branch, tag or commit'
        default: 'master'
        required: true

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.matrix.outputs.architectures }}
    steps:
      - name: Validate inputs
        id: matrix
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          set -euo pipefail
          if ! [[ "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "Invalid package name '$PACKAGE_NAME'"; exit 1
          fi
          for arch in ${ARCHITECTURES//,/ }; do
            case "$arch" in aarch64|arm|i686|x86_64) ;; *) echo "Invalid architecture '$arch'"; exit 1 ;; esac
          done
          echo "architectures=$(jq -cn --arg a "$ARCHITECTURES" '$a | split(",")')" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.architectures) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Clone termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_packages_ref }}
          path: termux-packages

      - name: Set app package name
        working-directory: termux-packages
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          sed -i -E "s/^TERMUX_APP__PACKAGE_NAME=\"[^\"]*\"$/TERMUX_APP__PACKAGE_NAME=\"$PACKAGE_NAME\"/" scripts/properties.sh
          grep -qx "TERMUX_APP__PACKAGE_NAME=\"$PACKAGE_NAME\"" scripts/properties.sh || {
            echo "Failed to set TERMUX_APP__PACKAGE_NAME in scripts/properties.sh"; exit 1; }

      - name: Build bootstrap
        working-directory: termux-packages
        run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures "${{ matrix.arch }}"

      - name: Check bootstrap prefix
        working-directory: termux-packages
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          ls -l bootstrap-*.zip
          unzip -p "bootstrap-${{ matrix.arch }}.zip" bin/login | head -n 1 | grep -q "^#!/data/data/$PACKAGE_NAME/files/usr/" || {
            echo "bootstrap-${{ matrix.arch }}.zip was not built for $PACKAGE_NAME"; exit 1; }

      - name: Upload bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.arch }}
          path: termux-packages/bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download bootstraps
        uses: actions/download-artifact@v8
        with:
          pattern: bootstrap-*
          merge-multiple: true
          path: bootstraps

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGES_REF: ${{ inputs.termux_packages_ref }}
        run: |
          set -euo pipefail
          cd bootstraps
          sha256sum bootstrap-*.zip > SHA256SUMS
          cat SHA256SUMS
          TAG="bootstrap-$PACKAGE_NAME-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Bootstrap for $PACKAGE_NAME ($GITHUB_RUN_NUMBER)" \
            --notes "Bootstrap archives built for package name \`$PACKAGE_NAME\` from termux/termux-packages \`$PACKAGES_REF\` by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
            bootstrap-*.zip SHA256SUMS
