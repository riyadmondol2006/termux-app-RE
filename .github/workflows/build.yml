name: Build

# Builds, tests and uploads APKs on every push and pull request. Pushing a "v*" tag also
# publishes a GitHub release with the signed release APKs.
#
# To publish a release without making a tag by hand, run this workflow from the Actions tab and
# choose "release": patch, minor or major bumps that part of the newest "v*" tag (the first
# release uses the fallback version in app/build.gradle), or enter an exact "version". The
# workflow then builds that version, creates the "v<version>" tag on the built commit and
# publishes the release. The app version is always taken from the tag, see app/build.gradle.
#
# Release APKs are signed with the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD repository secrets. Builds without them (like pull requests from forks)
# produce unsigned release APKs.

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release by bumping the newest v* tag (none: only build)'
        type: choice
        options: [ 'none', 'patch', 'minor', 'major' ]
        default: 'none'
      version:
        description: 'Or publish a release with this exact version, like 1.2.0 or 1.3.0-beta.1'
        type: string
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          # The app version comes from the newest "v*" tag, see app/build.gradle.
          fetch-depth: 0

      - name: Setup java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Rust
        shell: bash
        run: |
          # The JNI libraries are written in Rust. Install the toolchain and Android targets
          # pinned in rust-toolchain.toml.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup show

      - name: Set build variables
        id: vars
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            GITHUB_SHA="${{ github.event.pull_request.head.sha }}" # Do not use the merge commit
          fi

          RELEASE_VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            RELEASE_VERSION="${INPUT_VERSION#v}"
          elif [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ "$INPUT_RELEASE" != "none" ]; then
            LATEST_VERSION="$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -z "$LATEST_VERSION" ]; then
              # First release: the fallback version of app/build.gradle, as there is no tag yet.
              RELEASE_VERSION="$(./gradlew -q :app:versionName | tail -n 1)"
              RELEASE_VERSION="${RELEASE_VERSION%%+*}"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
              case "$INPUT_RELEASE" in
                patch) PATCH=$((PATCH + 1)) ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              esac
              RELEASE_VERSION="$MAJOR.$MINOR.$PATCH"
            fi
          fi

          if [ -n "$RELEASE_VERSION" ]; then
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version '$RELEASE_VERSION', expected major.minor.patch(-prerelease)"; exit 1
            fi
            if [[ "$GITHUB_REF" != refs/tags/v* ]] && git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
              echo "The tag v$RELEASE_VERSION already exists"; exit 1
            fi
            TAG_VERSION_NAME="$RELEASE_VERSION"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
          else
            # The newest "v*" tag, or the fallback version of app/build.gradle if there is none.
            # The "+" build metadata keeps semantic versioning precedence intact.
            VERSION_NAME="$(./gradlew -q :app:versionName | tail -n 1)"
            test -n "$VERSION_NAME" || { echo "Failed to get the versionName from app/build.gradle"; exit 1; }
            TAG_VERSION_NAME="${VERSION_NAME%%+*}+${GITHUB_SHA:0:7}"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
          APK_VERSION_TAG="v$TAG_VERSION_NAME"
          echo "TERMUX_APP_VERSION_NAME=$TAG_VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> "$GITHUB_ENV"

          # Use the newest bootstrap made by the Build bootstraps workflow for the app's package
          # name, published on this repository's GitHub Pages site as bootstrap/<id>, with
          # bootstrap/latest set to the id. Its SHA256SUMS must be signed with the Termux RE
          # repository key, and app/build.gradle checks the zips against it. Without one, the
          # official bootstrap is used.
          PACKAGE_NAME="$(sed -n 's/^termuxPackageName=//p' gradle.properties)"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          SITE_URL="https://${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          BOOTSTRAP_ID="$(curl -fsSL "$SITE_URL/bootstrap/latest?nocache=$RANDOM$RANDOM" || true)"
          BOOTSTRAP_ID="$(echo "$BOOTSTRAP_ID" | head -n 1)"
          if [ "$PACKAGE_NAME" != "com.termux" ] && [[ "$BOOTSTRAP_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            BOOTSTRAP_URL="$SITE_URL/bootstrap/$BOOTSTRAP_ID"
            curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS" "$BOOTSTRAP_URL/SHA256SUMS"
            curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS.asc" "$BOOTSTRAP_URL/SHA256SUMS.asc"
            gpgv --keyring "$PWD/apt-repo/termux-re.gpg" "$RUNNER_TEMP/SHA256SUMS.asc" "$RUNNER_TEMP/SHA256SUMS"
            echo "Using bootstrap $BOOTSTRAP_URL"
            echo "TERMUX_BOOTSTRAP_URL=$BOOTSTRAP_URL" >> "$GITHUB_ENV"
          elif [ "$PACKAGE_NAME" != "com.termux" ]; then
            echo "::warning::No bootstrap found at $SITE_URL/bootstrap/latest, building with the official bootstrap. It only works for package name com.termux. Run the 'Build bootstraps' workflow to make one."
          fi

      - name: Setup release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is not available, release APKs will be unsigned."
            echo "IS_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          {
            echo "TERMUX_RELEASE_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "TERMUX_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TERMUX_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "TERMUX_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "IS_SIGNED=true"
          } >> "$GITHUB_ENV"

      - name: Run tests and lint
        # Lint catches calls to APIs newer than minSdk, which crash on older Android versions.
        run: ./gradlew test lintDebug

      - name: Build APKs
        env:
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "1"
        run: |
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG-release"
          ./gradlew assembleRelease
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG-debug"
          ./gradlew assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/apks"
          mkdir -p "$OUT_DIR"
          for build_type in release debug; do
            for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
              apk="app/build/outputs/apk/$build_type/termux-app_$APK_VERSION_TAG-${build_type}_$abi.apk"
              test -f "$apk" || { echo "Missing $apk"; ls "app/build/outputs/apk/$build_type"; exit 1; }
              suffix=""
              if [ "$build_type" == "release" ] && [ "$IS_SIGNED" != "true" ]; then suffix="-unsigned"; fi
              cp "$apk" "$OUT_DIR/termux-re_$APK_VERSION_TAG-${build_type}${suffix}_$abi.apk"
            done
          done
          (cd "$OUT_DIR" && sha256sum *.apk > sha256sums.txt && cat sha256sums.txt)
          if [ "$IS_SIGNED" == "true" ]; then
            APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
            "$APKSIGNER" verify --print-certs "$OUT_DIR"/*-release_universal.apk | grep -v "^WARNING" | head -n 3
          fi
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: termux-re_${{ env.APK_VERSION_TAG }}-release
          path: |
            ${{ env.OUT_DIR }}/*-release*.apk
            ${{ env.OUT_DIR }}/sha256sums.txt

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: termux-re_${{ env.APK_VERSION_TAG }}-debug
          path: |
            ${{ env.OUT_DIR }}/*-debug_*.apk
            ${{ env.OUT_DIR }}/sha256sums.txt

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$IS_SIGNED" != "true" ]; then
            echo "Refusing to publish a release with unsigned APKs. Add the signing secrets."
            exit 1
          fi
          if [ -z "${TERMUX_BOOTSTRAP_URL:-}" ] && [ "$PACKAGE_NAME" != "com.termux" ]; then
            echo "Refusing to publish a release with the official bootstrap, which does not work for '$PACKAGE_NAME'. Run the 'Build bootstraps' workflow first."
            exit 1
          fi
          RELEASE_TYPE="--latest"
          if [[ "$APK_VERSION_TAG" == *-* ]]; then RELEASE_TYPE="--prerelease"; fi
          # Prepended to the notes generated from the changes since the previous release.
          NOTES="Download the APK for your device, \`arm64-v8a\` for nearly all current phones, or \`universal\` if unsure. See [Installation](https://github.com/$GITHUB_REPOSITORY#installation) and [Packages and the bootstrap](https://github.com/$GITHUB_REPOSITORY#packages-and-the-bootstrap). Updates must be signed with the same key: release APKs don't install over debug builds."
          # For a workflow_dispatch release, this creates the tag on the built commit.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Termux RE $APK_VERSION_TAG" --notes "$NOTES" --generate-notes $RELEASE_TYPE \
            "$OUT_DIR"/*-release_*.apk
