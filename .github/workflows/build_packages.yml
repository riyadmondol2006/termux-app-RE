name: Build packages

# Builds packages for the app package name (termuxPackageName in gradle.properties) from
# termux-packages sources and publishes them in the Termux RE apt repository on GitHub Pages
# with the Publish packages workflow. Termux binaries hardcode /data/data/<package name>/files/usr,
# so packages from the official repositories don't work in Termux RE.
#
# - Without a package list, the packages that apt-repo/packages.txt lists for each architecture
#   are built. That happens every week too, so the repository follows termux-packages, and
#   command-not-found is rebuilt with the current package list.
# - The repository keeps the packages asked for and their runtime dependencies on the
#   architectures they were built for, not the dependencies that were only needed to build them.
# - The Package request workflow calls it for packages requested in issues.
# - Dependencies are built and published too. Once the repository exists, those it already has
#   at the version termux-packages wants are downloaded from it instead of built again, and
#   requested packages it already has at their current version are skipped.
# - Each architecture builds in one job, limited to 6 hours by GitHub. Packages that don't fit
#   are reported and can be built by running the workflow again; what was built is published.
#
# See apt-repo/ and the "Packages and the bootstrap" section of README.md.

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_call:
    inputs:
      packages:
        type: string
        required: false
        default: ''
      architectures:
        type: string
        required: false
        default: 'aarch64,arm,i686,x86_64'
      termux_packages_ref:
        type: string
        required: false
        default: 'master'
      force:
        type: boolean
        required: false
        default: false
      publish:
        type: boolean
        required: false
        default: true
      jobs:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to build, separated by spaces. Empty builds apt-repo/packages.txt'
        required: false
        default: ''
      architectures:
        description: 'Comma separated architectures'
        required: true
        default: 'aarch64,arm,i686,x86_64'
      termux_packages_ref:
        description: 'termux/termux-packages branch, tag or commit'
        required: true
        default: 'master'
      force:
        description: 'Also build packages that are in the repository at the same version'
        type: boolean
        default: false
      publish:
        description: 'Publish the built packages in the repository'
        type: boolean
        default: true
      jobs:
        description: 'Parallel jobs per build, fewer for builds that run out of memory. Empty for one per CPU'
        required: false
        default: ''

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      architectures: ${{ steps.inputs.outputs.architectures }}
      packages: ${{ steps.inputs.outputs.packages }}
      package_name: ${{ steps.inputs.outputs.package_name }}
      repo_url: ${{ steps.inputs.outputs.repo_url }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: apt-repo
          persist-credentials: false

      - name: Validate inputs
        id: inputs
        shell: bash
        env:
          ARCHITECTURES: ${{ inputs.architectures || 'aarch64,arm,i686,x86_64' }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail -o noglob
          for arch in ${ARCHITECTURES//,/ }; do
            case "$arch" in aarch64|arm|i686|x86_64) ;; *) echo "Invalid architecture '$arch'"; exit 1 ;; esac
          done
          # Empty: each architecture builds what apt-repo/packages.txt lists for it.
          PACKAGES="$(echo $PACKAGES)"
          for package in $PACKAGES; do
            [[ "$package" =~ ^[a-z0-9][a-z0-9+._-]*$ ]] || { echo "Invalid package name '$package'"; exit 1; }
          done
          PACKAGE_NAME="$(sed -n 's/^termuxPackageName=//p' gradle.properties)"
          test -n "$PACKAGE_NAME" || { echo "Failed to read termuxPackageName from gradle.properties"; exit 1; }
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_URL="https://${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/apt/termux-main"
          echo "Packages: $PACKAGES"
          {
            echo "architectures=$(jq -cn --arg a "$ARCHITECTURES" '$a | split(",")')"
            echo "packages=$PACKAGES"
            echo "package_name=$PACKAGE_NAME"
            echo "repo_url=$REPO_URL"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.architectures) }}
    steps:
      - name: Set deadline
        # Leave time to upload what was built before the 360 minute job limit.
        run: echo "DEADLINE=$(( $(date +%s) + 340 * 60 ))" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          # Some builds, like V8 for codex, need more memory than the runner has: without swap
          # the runner is killed and the job fails without a log.
          if sudo fallocate -l 16G /termux-re-swap && sudo chmod 600 /termux-re-swap && \
              sudo mkswap /termux-re-swap > /dev/null && sudo swapon /termux-re-swap; then
            echo "Added 16 GB of swap"
          else
            echo "::warning::Failed to add swap, builds that need a lot of memory may fail"
          fi
          df -h /
          free -h

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: apt-repo
          path: termux-app-re
          persist-credentials: false

      - name: Clone termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_packages_ref || 'master' }}
          path: termux-packages
          persist-credentials: false

      - name: Configure termux-packages
        env:
          PACKAGE_NAME: ${{ needs.setup.outputs.package_name }}
          REPO_URL: ${{ needs.setup.outputs.repo_url }}
        run: |
          ./termux-app-re/apt-repo/fix-termux-packages.sh termux-packages
          ./termux-app-re/apt-repo/patch-termux-packages.sh termux-packages "$PACKAGE_NAME" "$REPO_URL" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          echo "termux-packages $(git -C termux-packages rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Start build container
        working-directory: termux-packages
        # build-package.sh -I verifies the repository signature with the keys in this keyring.
        run: |
          set -euo pipefail
          FINGERPRINT="$(gpg --show-keys --with-colons packages/termux-keyring/termux-re.gpg | awk -F: '/^fpr/ { print $10; exit }')"
          ./scripts/run-docker.sh gpg --import packages/termux-keyring/termux-re.gpg
          echo "$FINGERPRINT:6:" | ./scripts/run-docker.sh gpg --import-ownertrust

      - name: Build packages
        id: build
        working-directory: termux-packages
        continue-on-error: true
        env:
          REPO_URL: ${{ needs.setup.outputs.repo_url }}
          PACKAGES: ${{ needs.setup.outputs.packages }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          BUILD_JOBS: ${{ inputs.jobs }}
        run: |
          # Packages named explicitly are kept as requested packages (roots.txt of the repository),
          # those of apt-repo/packages.txt through that file.
          export ROOTS_FILE="$RUNNER_TEMP/roots.txt"
          if [ -z "$PACKAGES" ]; then
            PACKAGES="$(python3 -I ../termux-app-re/apt-repo/package-list.py ../termux-app-re/apt-repo/packages.txt "${{ matrix.arch }}")"
            ROOTS_FILE=/dev/null
          fi
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY" \
            ../termux-app-re/apt-repo/build-packages.sh "${{ matrix.arch }}" "$REPO_URL" "$DEADLINE" "$FORCE" $PACKAGES

      - name: Check packages
        working-directory: termux-packages
        env:
          PACKAGE_NAME: ${{ needs.setup.outputs.package_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(output/*.deb)
          echo "${#debs[@]} packages built"
          ls -l output/ || true
          for deb in "${debs[@]}"; do
            # Every file must be installed under the app's data directory.
            bad="$(dpkg-deb --fsys-tarfile "$deb" | tar -t | grep -vE "^\./(data/(data/($PACKAGE_NAME(/.*)?)?)?)?/?$" || true)"
            if [ -n "$bad" ]; then
              echo "$deb has files outside /data/data/$PACKAGE_NAME:"; echo "$bad" | head; exit 1
            fi
          done

      - name: Collect packages
        # Artifact file names can't contain ":", which versions with an epoch have. The file
        # names don't matter, the repository is built from the package metadata. roots.txt lists
        # the packages that were asked for, the repository keeps them and their dependencies.
        run: |
          mkdir debs
          for deb in termux-packages/output/*.deb; do
            [ -e "$deb" ] && cp "$deb" "debs/$(basename "$deb" | tr ':' '_')"
          done
          ls debs | wc -l
          cp "$RUNNER_TEMP/roots.txt" debs/roots.txt 2>/dev/null || true

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.arch }}
          path: debs/
          if-no-files-found: warn
          retention-days: 14

      - name: Report build failures
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::Some packages for ${{ matrix.arch }} failed or were not built in time, see the job summary."
          exit 1

  publish:
    needs: [setup, build]
    # Publish what was built even if some packages failed.
    if: ${{ !cancelled() && inputs.publish != false && needs.setup.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish_packages.yml
    with:
      artifact_pattern: debs-*
    secrets: inherit
